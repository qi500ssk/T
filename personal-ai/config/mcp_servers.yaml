mcp_servers:
  demo:
    transport: stdio
    enabled: true
    default_risk_level: high
    command: python
    args:
    - -m
    - scripts.mcp_demo_server
    allowed_tools:
    - echo
    - random_number
    tool_risk_levels:
      echo: low
      random_number: high
  desktop-media:
    transport: stdio
    enabled: true
    default_risk_level: medium
    command: python
    args:
    - -m
    - mcp_servers.desktop_media.server
    allowed_tools:
    - qqmusic_launch
    - qqmusic_search_play
    - qqmusic_list_liked
    - qqmusic_play_liked
    - media_play_pause
    - media_next
    - media_previous
    - media_get_current
  playwright:
    transport: stdio
    enabled: true
    default_risk_level: medium
    command: D:\node.js\npx.cmd
    args:
    - -y
    - '@playwright/mcp@latest'
    - --browser
    - chrome
    - --isolated
    - --output-dir
    - ./data/playwright
    allowed_tools:
    - browser_navigate
    - browser_snapshot
    - browser_find
    - browser_click
    - browser_type
    - browser_fill_form
    - browser_select_option
    - browser_press_key
    - browser_wait_for
    - browser_tabs
    - browser_close
