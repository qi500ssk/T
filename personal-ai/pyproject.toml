[project]
name = "personal-ai"
version = "0.1.0"
description = "Personal AI Agent - P2: chat, memory and RAG knowledge base"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "anyio>=4.4",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
