[project]
name = "personal-ai"
version = "0.1.0"
description = "Personal AI Agent - chat, memory, RAG, tools and MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "anyio>=4.4",
    "fastembed>=0.7,<0.8",
    "numpy>=1.26",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.9",
    "mcp>=1.28,<2",
]

[dependency-groups]
legacy-embedding = ["sentence-transformers>=3.0"]
postgres-import = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
